name: Build iOS Sideload IPA

# Builds a release .ipa that can be re-signed locally with xtool / Sideloadly /
# AltStore. The optional "signed" mode uses an Apple Developer certificate and
# provisioning profile stored in repository secrets (paid account required).
#
# GitHub Actions cannot install an app onto your iPhone. Install the downloaded
# IPA from your Linux machine with:
#
#   ./scripts/ios-sideload.sh --build
#   # or
#   xtool install ledgerleaf-....ipa
#
# See docs/SIDELOAD_XTOOL.md for the full walkthrough.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'unsigned = re-sign locally with xtool; signed = CI-sign with Apple Developer secrets'
        required: true
        type: choice
        default: 'unsigned'
        options:
          - 'unsigned'
          - 'signed'
      export_method:
        description: 'Export method for a signed build'
        required: false
        type: choice
        default: 'development'
        options:
          - 'development'
          - 'ad-hoc'
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.47.5'
      xcode_version:
        description: 'Xcode version (16.4, latest-stable, etc.)'
        required: false
        default: '16.4'
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/ios-sideload.sh'
      - '.github/workflows/ios-sideload.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-sideload.yml'

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA (${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'unsigned' }})
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'unsigned' }}
      EXPORT_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.export_method || 'development' }}
      FLUTTER_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.flutter_version || '3.47.5' }}
      XCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.xcode_version || '16.4' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # GitHub's release-asset download endpoint intermittently returns 504 on
      # hosted runners, which breaks package:sqlite3's build hook. Fetch the
      # prebuilt binaries through the REST API instead.
      - name: Prefetch SQLite native assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/fetch_sqlite_assets.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Extract build metadata
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          APP_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Commit: $SHORT_SHA, version: $APP_VERSION"

      # -----------------------------------------------------------------
      # Unsigned release build. xtool/Sideloadly re-signs this locally.
      # -----------------------------------------------------------------
      - name: Build unsigned release
        if: env.BUILD_TYPE == 'unsigned'
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-tree-shake-icons \
            > build_unsigned.log 2>&1 || (cat build_unsigned.log; exit 1)

          APP_PATH=$(find build/ios -type d -name Runner.app -path '*iphoneos*' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -type d -name Runner.app | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app was not produced by flutter build ios"
            exit 1
          fi

          echo "Built app bundle: $APP_PATH"

          STAGING="$RUNNER_TEMP/ipa-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload" output
          cp -R "$APP_PATH" "$STAGING/Payload/Runner.app"

          IPA="output/ledgerleaf-${APP_VERSION}-${SHORT_SHA}-unsigned.ipa"
          (cd "$STAGING" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/$IPA")

          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      # -----------------------------------------------------------------
      # Optional signed build (paid Apple Developer account).
      # -----------------------------------------------------------------
      - name: Validate signing secrets
        if: env.BUILD_TYPE == 'signed'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "$IOS_CERTIFICATE_BASE64" ] && missing="$missing IOS_CERTIFICATE_BASE64"
          [ -z "$IOS_CERTIFICATE_PASSWORD" ] && missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$IOS_TEAM_ID" ] && missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Signed build requested but these secrets are missing:$missing"
            exit 1
          fi

      - name: Install signing certificate and profile
        if: env.BUILD_TYPE == 'signed'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_APP_GROUP: ${{ secrets.IOS_APP_GROUP }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_FILE="$RUNNER_TEMP/certificate.p12"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERT_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          PROFILE_FILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_FILE"
          security cms -D -i "$PROFILE_FILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_FILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Installed profile '$PROFILE_NAME' ($PROFILE_UUID)"

          PROJECT_BUNDLE_ID=$(python3 - <<'PY'
          import re
          text = open('ios/Runner.xcodeproj/project.pbxproj').read()
          match = re.search(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*([^;]+);', text)
          print((match.group(1).strip() if match else 'com.ledgerleaf.ledgerleaf').strip('"'))
          PY
          )
          TARGET_BUNDLE_ID="${IOS_BUNDLE_ID:-$PROJECT_BUNDLE_ID}"
          echo "Bundle ID: $TARGET_BUNDLE_ID"

          if [ "$TARGET_BUNDLE_ID" != "$PROJECT_BUNDLE_ID" ]; then
            python3 - "$PROJECT_BUNDLE_ID" "$TARGET_BUNDLE_ID" <<'PY'
          import sys
          old, new = sys.argv[1], sys.argv[2]
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          text = open(path).read().replace(old, new)
          open(path, 'w').write(text)
          PY
          fi

          # The Runner target now uses Runner.entitlements. Only add the App
          # Group when the user explicitly provides one (paid accounts only).
          if [ -n "$IOS_APP_GROUP" ]; then
            python3 - "$IOS_APP_GROUP" <<'PY'
          import sys
          group = sys.argv[1]
          path = 'ios/Runner/Runner.entitlements'
          text = open(path).read()
          if 'com.apple.security.application-groups' not in text:
              text = text.replace(
                  '<dict>',
                  '<dict>\n\t<key>com.apple.security.application-groups</key>\n'
                  '\t<array>\n\t\t<string>%s</string>\n\t</array>' % group,
                  1,
              )
          open(path, 'w').write(text)
          PY
            echo "Added App Group entitlement: $IOS_APP_GROUP"
          fi

          # Set DEVELOPMENT_TEAM so xcodebuild can resolve the installed profile.
          python3 - "$IOS_TEAM_ID" <<'PY'
          import sys
          team = sys.argv[1]
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          text = open(path).read()
          if 'DEVELOPMENT_TEAM' not in text:
              text = text.replace(
                  'PRODUCT_BUNDLE_IDENTIFIER = ',
                  'DEVELOPMENT_TEAM = %s;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = ' % team,
              )
          open(path, 'w').write(text)
          PY

          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${TARGET_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          echo "EXPORT_PLIST=$EXPORT_PLIST" >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: env.BUILD_TYPE == 'signed'
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --export-options-plist="$EXPORT_PLIST" \
            --no-tree-shake-icons > build_signed.log 2>&1 || (cat build_signed.log; exit 1)

          BUILT_IPA=$(find build/ios/ipa -name '*.ipa' | head -n 1)
          if [ -z "$BUILT_IPA" ]; then
            echo "::error::No signed IPA was produced in build/ios/ipa"
            exit 1
          fi

          mkdir -p output
          IPA="output/ledgerleaf-${APP_VERSION}-${SHORT_SHA}-signed.ipa"
          cp "$BUILT_IPA" "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Remove temporary signing credentials
        if: always() && env.BUILD_TYPE == 'signed'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" \
                "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/profile.plist" \
                "$RUNNER_TEMP/ExportOptions.plist"

      # -----------------------------------------------------------------
      # Package checks. These catch the failure modes that make a sideloaded
      # app install but crash / show a blank screen.
      # -----------------------------------------------------------------
      - name: Verify IPA contents
        if: success()
        run: |
          set -euo pipefail
          echo "IPA=$IPA"

          VERIFY="$RUNNER_TEMP/verify-ipa"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          unzip -q "$IPA" -d "$VERIFY"

          APP="$VERIFY/Payload/Runner.app"
          test -x "$APP/Runner" || { echo "::error::Runner executable missing"; exit 1; }
          test -f "$APP/Frameworks/App.framework/App" || { echo "::error::Flutter App.framework missing"; exit 1; }
          test -d "$APP/Frameworks/App.framework/flutter_assets" || { echo "::error::Flutter assets missing"; exit 1; }

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          echo "Minimum iOS: $MIN_OS"

          if [ "$MIN_OS" != "16.0" ] && [ "$MIN_OS" != "16" ]; then
            echo "::warning::MinimumOSVersion is $MIN_OS (expected 16.0)"
          fi

          # This is the check that would have caught the un-compiled native files.
          if [ -d "$APP/Metadata.appintents" ] ||
             grep -aq 'IngestSmsIntent' "$APP/Runner" ||
             grep -aq 'Log Transaction from SMS' "$APP/Runner"; then
            echo "Native App Intent code is present."
          else
            echo "::error::IngestSmsIntent is not compiled into the app. The Shortcuts action will be missing."
            exit 1
          fi

          if grep -aq 'Log Transaction from SMS' "$APP/Runner"; then
            echo "App Shortcut metadata is present."
          else
            echo "::warning::Could not find the App Shortcut title in the binary; verify the action appears in Shortcuts."
          fi

          echo "IPA verification passed."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ledgerleaf-ios-${{ env.BUILD_TYPE }}-${{ env.SHORT_SHA }}
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: ledgerleaf-ios-dsyms-${{ env.SHORT_SHA }}
          path: build/ios/**/*.dSYM
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ env.SHORT_SHA }}
          path: |
            build_unsigned.log
            build_signed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "# LedgerLeaf iOS build"
            echo
            echo "- **Mode:** \`${BUILD_TYPE}\`"
            echo "- **Flutter:** \`${FLUTTER_VERSION}\`"
            echo "- **Version:** \`${APP_VERSION}\`"
            echo "- **Commit:** \`${SHORT_SHA}\`"
            echo "- **Status:** ${{ job.status }}"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "## Install from Linux (no Windows required)"
              echo
              echo '```bash'
              echo "gh run download ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} -n ledgerleaf-ios-${BUILD_TYPE}-${SHORT_SHA}"
              echo "xtool install ledgerleaf-*.ipa"
              echo '```'
              echo
              echo "Or run \`./scripts/ios-sideload.sh --build\` from the repo root."
              echo
              echo "Free Apple ID signatures expire after 7 days. Enable Developer Mode and trust your Apple ID in Settings > General > VPN & Device Management."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
