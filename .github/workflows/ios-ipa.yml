name: Build LedgerLeaf iOS IPA

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Build distribution type: unsigned (for CI inspection and local sideloaders) or signed (requires Apple Developer secrets)'
        required: true
        type: choice
        default: 'unsigned'
        options:
          - 'unsigned'
          - 'signed'
      export_method:
        description: 'Export method for signed build (development is recommended for sideloading to registered devices)'
        required: false
        type: choice
        default: 'development'
        options:
          - 'development'
          - 'ad-hoc'
      flutter_version:
        description: 'Flutter SDK version (defaults to project version 3.47.5)'
        required: false
        default: '3.47.5'
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-ipa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Build iOS IPA (${{ github.event_name == 'workflow_dispatch' && inputs.distribution || 'unsigned' }})
    runs-on: macos-14
    timeout-minutes: 60

    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.distribution || 'unsigned' }}
      EXPORT_METHOD: ${{ github.event_name == 'workflow_dispatch' && inputs.export_method || 'development' }}
      FLUTTER_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.flutter_version || '3.47.5' }}

    steps:
      - name: Validate Inputs and Execution Mode
        run: |
          echo "Triggered by event: ${{ github.event_name }}"
          echo "Selected Build Mode: $BUILD_MODE"
          echo "Target Flutter Version: $FLUTTER_VERSION"
          if [ "$BUILD_MODE" != "unsigned" ] && [ "$BUILD_MODE" != "signed" ]; then
            echo "::error::Unsupported distribution mode: '$BUILD_MODE'. Allowed values: 'unsigned', 'signed'."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Project Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APP_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr '+' '-')
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "Commit: $SHORT_SHA, Version: $APP_VERSION"

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            echo "Selecting Xcode 16.0..."
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            echo "Selecting Xcode 15.4..."
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            echo "Using default active Xcode installation."
          fi
          xcodebuild -version

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Dart & Flutter Unit Tests
        run: flutter test

      - name: Install CocoaPods Dependencies (if configured)
        run: |
          if [ -f ios/Podfile ]; then
            echo "ios/Podfile detected. Running pod install..."
            pod install --project-directory=ios
          else
            echo "No ios/Podfile found. LedgerLeaf uses Flutter Swift Package Manager (SPM) plugin integration."
          fi

      # -------------------------------------------------------------
      # MODE A: UNSIGNED BUILD (CI Inspection & Local Re-signing)
      # -------------------------------------------------------------
      - name: Build Unsigned iOS Application
        if: env.BUILD_MODE == 'unsigned'
        run: |
          echo "Building iOS release bundle without code signing..."
          mkdir -p output
          flutter build ios --release --no-codesign -v > build_unsigned.log 2>&1 || (cat build_unsigned.log && exit 1)

          echo "Packaging Runner.app into standard Payload directory structure..."
          PAYLOAD_DIR="build/ios/unsigned_payload/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "build/ios/iphoneos/Runner.app" "$PAYLOAD_DIR/"

          cd "build/ios/unsigned_payload"
          IPA_NAME="ledgerleaf-${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}-unsigned.ipa"
          zip -r -q "$GITHUB_WORKSPACE/output/$IPA_NAME" Payload
          cd "$GITHUB_WORKSPACE"

          echo "Unsigned IPA packaged successfully at: output/$IPA_NAME"
          ls -lh output/*.ipa

      # -------------------------------------------------------------
      # MODE B: SIGNED BUILD (Apple Developer Certificate & Profile)
      # -------------------------------------------------------------
      - name: Validate Signing Secrets
        if: env.BUILD_MODE == 'signed'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          MISSING=""
          [ -z "$IOS_CERTIFICATE_BASE64" ] && MISSING="$MISSING IOS_CERTIFICATE_BASE64"
          [ -z "$IOS_CERTIFICATE_PASSWORD" ] && MISSING="$MISSING IOS_CERTIFICATE_PASSWORD"
          [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] && MISSING="$MISSING IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$IOS_TEAM_ID" ] && MISSING="$MISSING IOS_TEAM_ID"

          if [ -n "$MISSING" ]; then
            echo "::error::Signed build requested, but required GitHub Secrets are missing:$MISSING"
            echo "Please configure these secrets in Repository Settings -> Secrets and variables -> Actions."
            echo "Consult docs/IOS_IPA_BUILD.md for complete signing instructions."
            exit 1
          fi
          echo "All required signing secrets are present."

      - name: Set up Temporary Keychain and Provisioning Profile
        if: env.BUILD_MODE == 'signed'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_APP_GROUP: ${{ secrets.IOS_APP_GROUP }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 16)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 2. Decode and import signing certificate (.p12)
          CERT_FILE="$RUNNER_TEMP/certificate.p12"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"

          security import "$CERT_FILE" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 3. Decode and install provisioning profile (.mobileprovision)
          PROFILE_FILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_FILE"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$PROFILE_FILE"))

          echo "Provisioning profile detected: '$PROFILE_NAME' (UUID: $PROFILE_UUID)"
          cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          # 4. Resolve Bundle ID and App Group
          PROJECT_BUNDLE_ID=$(python3 -c "
          import re
          with open('ios/Runner.xcodeproj/project.pbxproj') as f:
              m = re.search(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*([^;]+);', f.read())
              print(m.group(1).strip() if m else 'com.ledgerleaf.ledgerleaf')
          ")
          TARGET_BUNDLE_ID="${IOS_BUNDLE_ID:-$PROJECT_BUNDLE_ID}"
          echo "Target Bundle Identifier: $TARGET_BUNDLE_ID"

          if [ -n "$IOS_BUNDLE_ID" ] && [ "$IOS_BUNDLE_ID" != "$PROJECT_BUNDLE_ID" ]; then
            python3 -c "
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          content = content.replace('$PROJECT_BUNDLE_ID', '$TARGET_BUNDLE_ID')
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          "
            echo "Updated project bundle identifier to: $TARGET_BUNDLE_ID"
          fi

          if [ -n "$IOS_APP_GROUP" ]; then
            python3 -c "
          with open('ios/Runner/Runner.entitlements', 'r') as f:
              content = f.read()
          content = content.replace('group.com.ledgerleaf.app', '$IOS_APP_GROUP')
          with open('ios/Runner/Runner.entitlements', 'w') as f:
              f.write(content)
          "
            echo "Updated App Group entitlement to: $IOS_APP_GROUP"
          fi

          # 5. Generate ExportOptions.plist
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat <<EOF > "$EXPORT_PLIST"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${TARGET_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          echo "EXPORT_PLIST=$EXPORT_PLIST" >> $GITHUB_ENV

      - name: Build Signed iOS Application
        if: env.BUILD_MODE == 'signed'
        run: |
          echo "Building signed iOS application archive and exporting IPA..."
          mkdir -p output
          flutter build ipa --release --export-options-plist="$EXPORT_PLIST" -v > build_signed.log 2>&1 || (cat build_signed.log && exit 1)

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Signed IPA was not generated in build/ios/ipa"
            exit 1
          fi

          DEST_IPA="output/ledgerleaf-${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}-signed.ipa"
          cp "$IPA_PATH" "$DEST_IPA"
          echo "Signed IPA successfully exported at: $DEST_IPA"
          ls -lh output/*.ipa

      - name: Clean up Keychain and Signing Credentials
        if: always() && env.BUILD_MODE == 'signed'
        run: |
          echo "Cleaning up temporary keychain and signing assets..."
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"

      # -------------------------------------------------------------
      # ARTIFACT UPLOAD & RUN REPORT
      # -------------------------------------------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledgerleaf-ios-${{ env.BUILD_MODE }}-${{ env.SHORT_SHA }}
          path: output/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs-${{ env.SHORT_SHA }}
          path: |
            build_unsigned.log
            build_signed.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Workflow Summary
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # LedgerLeaf iOS Build Summary

          - **Build Mode:** \`${{ env.BUILD_MODE }}\`
          - **Commit SHA:** \`${{ env.SHORT_SHA }}\`
          - **App Version:** \`${{ env.APP_VERSION }}\`
          - **Status:** ${{ job.status }}

          EOF

          if [ "${{ env.BUILD_MODE }}" = "unsigned" ]; then
            cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### ⚠️ Unsigned Build Notice
          The generated \`.ipa\` is **unsigned**:
          - **Purpose:** CI verification, package artifact inspection, and local signing via personal sideloaders.
          - **Installation:** iOS does not allow installing unsigned IPAs directly without sideloading utilities.
            - To sideload on your device, use **AltStore** or **Sideloadly** (re-signing with your free Apple ID over USB).
            - Or use **TrollStore** if running on an eligible iOS version with CoreTrust vulnerability.
            - For a directly installable signed IPA, configure repository secrets and trigger with \`distribution: signed\`.
          EOF
          else
            cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### ✅ Signed Build Notice
          The generated \`.ipa\` was signed with your Apple Developer provisioning profile.
          - **Installation:** Install on registered devices via **Apple Configurator**, **Xcode**, **AltStore**, or **Sideloadly**.
          - **Shortcuts Setup:** Remember to configure the Personal Automation in the Apple Shortcuts app to enable automatic transaction capture.
          EOF
          fi
